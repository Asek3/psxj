about.title=О программе PSXJ
about.version=Версия 0.1.0 • Java 21
about.body=PSXJ — эмулятор PlayStation на Java 21.\n\nРеализованы интерпретатор R3000A, GPU, SPU, CD-ROM, DMA, таймеры, карты памяти, сейв-стейты, ввод через SDL-геймпады и звук через OpenAL / SDL.\n\nСовместимость находится в разработке. Нужны BIOS PS1 и законно полученные образы игр пользователя.
