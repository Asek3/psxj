about.title=About PSXJ
about.version=Version 0.1.0 • Java 21
about.body=PSXJ is a PlayStation emulator written in Java 21.\n\nIt includes an R3000A interpreter, GPU, SPU, CD-ROM, DMA, timers, memory cards, save states, SDL gamepad input, and OpenAL / SDL audio output.\n\nCompatibility is under development. A user-supplied PS1 BIOS and legally obtained game images are required.
