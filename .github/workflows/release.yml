name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release on Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          cache-provider: basic

      - name: Verify release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(./gradlew -q printVersion)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Run clean test suite
        run: ./gradlew clean test --no-daemon --stacktrace

  package:
    name: Package ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            arch: x64
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            arch: aarch64
          - target: linux-x64
            runner: ubuntu-24.04
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - target: macos-x64
            runner: macos-15-intel
            arch: x64
          - target: macos-arm64
            runner: macos-15
            arch: aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.arch }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          cache-provider: basic

      - name: Build platform JAR
        shell: bash
        run: ./gradlew shadowJar -PnativeTarget=${{ matrix.target }} --no-daemon --stacktrace

      - name: Stage release package
        shell: bash
        run: |
          mkdir -p release
          cp build/libs/psxj-*-${{ matrix.target }}.jar release/
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md release/

      - name: Upload staged files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum psxj-*.jar > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
