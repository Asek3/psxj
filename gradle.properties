# Throughput-oriented build JVM; this is separate from the emulator profiles.
org.gradle.jvmargs=-Xms512m -Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Keep incremental work and configuration reusable across invocations.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.warning.mode=summary

systemProp.file.encoding=UTF-8
